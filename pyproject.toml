[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "1.0.0"
description = "Route LLM calls across providers: fallback chains per role, spending caps, rate limits, a cost ledger."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Accatino" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]

[project.urls]
Repository = "https://github.com/zerdastudio/llm-router"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
